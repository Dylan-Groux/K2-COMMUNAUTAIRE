name: CI

on:
  push:
    branches: [master]
  pull_request:

# Deux pushs rapprochés : seul le plus récent va au bout, sinon l'ancien pourrait écraser « deploy » après le nouveau.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: VITE_API_URL renseigné
        run: grep -Eq '^VITE_API_URL=.+' apps/web/.env.production
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: web-dist
          path: apps/web/dist
          # Sans ça, le .htaccess du site ne serait pas dans l'archive.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Le serveur o2switch ne suit que la branche « deploy » (scripts/deploy.sh) : elle ne reçoit que du code testé.
  # « deploy » = le commit de master qui vient de passer + le front construit (apps/web/dist), que le serveur n'a
  # donc pas à construire. L'API tourne avec tsx, sans build.
  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force apps/web/dist
          git commit --quiet -m "deploy : $GITHUB_SHA"
          git push --force origin HEAD:refs/heads/deploy
